# Administration du site de l'Atelier (Decap CMS)
# Seule ligne à modifier : "repo", avec ton identifiant GitHub et le nom du dépôt.
backend:
  name: github
  repo: TON-IDENTIFIANT-GITHUB/latelier
  branch: main
  commit_messages:
    create: "Ajout : {{slug}}"
    update: "Modification : {{slug}}"
    delete: "Suppression : {{slug}}"
    uploadMedia: "Photo : {{path}}"
    deleteMedia: "Photo supprimée : {{path}}"

locale: fr
site_url: https://latelier.fr
display_url: https://latelier.fr
media_folder: photos
public_folder: /photos

collections:

  # ---------------- AGENDA ----------------
  - name: agenda
    label: Agenda
    description: "Les sessions à réserver. Une session disparaît du site toute seule après sa date de fin."
    files:
      - name: sessions
        label: Sessions
        file: content/sessions.json
        format: json
        fields:
          - name: sessions
            label: Sessions
            label_singular: session
            widget: list
            summary: "{{fields.titre}} ({{fields.dates}})"
            fields:
              - { name: titre, label: Titre, widget: string }
              - name: collection
                label: Collection
                widget: relation
                collection: maison
                file: collections
                search_fields: ["collections.*.nom"]
                display_fields: ["collections.*.nom"]
                value_field: "collections.*.id"
              - name: intervenant
                label: Intervenant
                widget: relation
                collection: maison
                file: intervenants
                search_fields: ["intervenants.*.nom"]
                display_fields: ["intervenants.*.nom"]
                value_field: "intervenants.*.id"
              - { name: lieu, label: Lieu, widget: string }
              - { name: dates, label: "Dates (texte affiché)", widget: string, hint: "Ex. : Du mardi 3 novembre au mardi 1er décembre 2026" }
              - { name: fin, label: "Date de la dernière séance", widget: datetime, date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD", hint: "Le lendemain, la session disparaît du site." }
              - { name: horaire, label: Horaire, widget: string }
              - { name: prix, label: "Prix (€)", widget: number, value_type: int, min: 0 }
              - { name: places, label: "Places restantes", widget: number, value_type: int, min: 0, hint: "0 = affiché Complet, avec liste d'attente." }
              - { name: lien_paiement, label: "Lien de paiement Stripe", widget: string, required: false, hint: "Colle ici le Payment Link créé dans Stripe pour cette session." }
              - { name: visible, label: "Afficher sur le site", widget: boolean, default: true }

  # ---------------- LA MAISON ----------------
  - name: maison
    label: La maison
    description: "Collections et intervenants."
    files:
      - name: collections
        label: Collections
        file: content/collections.json
        format: json
        fields:
          - name: collections
            label: Collections
            label_singular: collection
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: id, label: "Identifiant", widget: string, pattern: ['^[a-z0-9-]+$', "Minuscules, chiffres et tirets uniquement, sans accent."], hint: "Court et définitif, ex. : ecriture. Ne le change plus ensuite." }
              - { name: nom, label: Nom, widget: string }
              - { name: couleur, label: Couleur, widget: color }
              - { name: ouverte, label: "Ouverte (sinon : Bientôt)", widget: boolean, default: true }
              - { name: texte, label: Description, widget: text }
      - name: intervenants
        label: Intervenants
        file: content/intervenants.json
        format: json
        fields:
          - name: intervenants
            label: Intervenants
            label_singular: intervenant
            widget: list
            summary: "{{fields.nom}}"
            fields:
              - { name: id, label: "Identifiant", widget: string, pattern: ['^[a-z0-9-]+$', "Minuscules, chiffres et tirets uniquement, sans accent."], hint: "Ex. : mahir-guven. Ne le change plus ensuite." }
              - { name: nom, label: Nom, widget: string }
              - name: collection
                label: Collection
                widget: relation
                collection: maison
                file: collections
                search_fields: ["collections.*.nom"]
                display_fields: ["collections.*.nom"]
                value_field: "collections.*.id"
              - { name: role, label: "Une ligne de présentation", widget: string }
              - { name: photo, label: Photo, widget: image, required: false, hint: "Passe automatiquement en noir et blanc avec la couleur de la collection." }
              - { name: a_venir, label: "Emplacement « Bientôt »", widget: boolean, default: false }

  # ---------------- TEXTES DU SITE ----------------
  - name: textes
    label: Textes du site
    files:
      - name: site
        label: Page d'accueil
        file: content/site.json
        format: json
        fields:
          - { name: signature, label: "Signature sous le logo", widget: string }
          - { name: bandeau, label: "Bandeau défilant", widget: list, field: { name: mot, label: Mot, widget: string } }
          - { name: hero_titre, label: "Grand titre (noir)", widget: string }
          - { name: hero_titre_couleur, label: "Grand titre (en bleu)", widget: string }
          - { name: hero_chapeau, label: "Texte sous le titre", widget: text }
          - { name: hero_photo, label: "Photo d'accueil", widget: image, required: false }
          - { name: hero_photo_legende, label: "Description de la photo (accessibilité)", widget: string }
          - { name: sticker, label: "Sticker rose", widget: string }
          - { name: consigne_visible, label: "Afficher la consigne de la semaine", widget: boolean, default: true }
          - { name: consigne_texte, label: "Consigne de la semaine", widget: text }
          - { name: consigne_regle, label: "Règle du jeu (petit texte)", widget: string }
          - { name: consigne_lien_inscription, label: "Lien d'inscription à la newsletter", widget: string, required: false, hint: "Page d'inscription Brevo, Substack…" }
          - name: textes_participants
            label: "Extraits de participants"
            label_singular: extrait
            widget: list
            fields:
              - { name: extrait, label: Extrait, widget: text }
              - { name: signature, label: "Prénom et cycle", widget: string }
          - { name: fondateur_photo, label: "Photo du fondateur", widget: image, required: false }
          - { name: fondateur_sticker, label: "Sticker du fondateur", widget: string }
          - { name: fondateur_texte, label: "Texte du fondateur", widget: text, hint: "Laisse une ligne vide entre deux paragraphes." }
          - { name: fondateur_credits, label: "Pastilles (livres, maisons…)", widget: list, field: { name: credit, label: Pastille, widget: string } }
          - { name: fondateur_lien, label: "Lien vers ton site d'auteur", widget: string, required: false }
          - name: faq
            label: Questions
            label_singular: question
            widget: list
            fields:
              - { name: question, label: Question, widget: string }
              - { name: reponse, label: Réponse, widget: text }
          - { name: email, label: "E-mail de contact", widget: string }
          - { name: instagram, label: "Lien Instagram", widget: string, required: false }

  # ---------------- PAGES LÉGALES ----------------
  - name: legal
    label: Pages légales
    files:
      - { name: mentions-legales, label: "Mentions légales", file: content/pages/mentions-legales.md, fields: [ { name: titre, label: Titre, widget: string }, { name: body, label: Texte, widget: markdown } ] }
      - { name: cgv, label: "Conditions générales de vente", file: content/pages/cgv.md, fields: [ { name: titre, label: Titre, widget: string }, { name: body, label: Texte, widget: markdown } ] }
      - { name: confidentialite, label: "Confidentialité", file: content/pages/confidentialite.md, fields: [ { name: titre, label: Titre, widget: string }, { name: body, label: Texte, widget: markdown } ] }
