<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>l'Atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .legal{padding:60px var(--pad) 0;max-width:820px}
  .legal h1{font-size:clamp(48px,7vw,96px);margin:0 0 40px}
  .legal h2{font-family:var(--display);font-weight:900;text-transform:uppercase;font-size:32px;margin:40px 0 12px}
  .legal p,.legal li{max-width:40em}
</style>
</head>
<body>
<header>
  <a class="logo" href="/" aria-label="l'Atelier, accueil"><i>l'</i><b>Atelier</b></a>
  <nav aria-label="Navigation principale"><a class="btn" href="/#agenda">Réserver</a></nav>
</header>
<main class="legal">
  <h1 class="gros" id="titre">Chargement…</h1>
  <div id="texte"></div>
  <p><a href="/">Retour à l'accueil</a></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<script>
(async () => {
  const pages = ["mentions-legales", "cgv", "confidentialite"];
  const p = new URLSearchParams(location.search).get("p");
  const titre = document.getElementById("titre"), texte = document.getElementById("texte");
  if (!pages.includes(p)) { titre.textContent = "Page introuvable"; return; }
  try {
    const brut = await (await fetch(`content/pages/${p}.md`, {cache: "no-cache"})).text();
    const m = brut.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    const entete = m ? m[1] : "", corps = m ? m[2] : brut;
    const t = (entete.match(/^titre:\s*(.*)$/m) || [])[1] || "";
    titre.textContent = t.replace(/^["']|["']$/g, "");
    document.title = titre.textContent + " — l'Atelier";
    texte.innerHTML = window.marked ? marked.parse(corps) : corps;
  } catch(e) {
    titre.textContent = "Page indisponible";
  }
})();
</script>
</body>
</html>
